name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/memory-affect
    paths:
      - .github/workflows/build-debug-apk.yml
      - lib/**
      - android/**
      - pubspec.yaml
      - pubspec.lock

permissions:
  contents: read
  actions: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep only the latest existing APK artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
            });
            const artifacts = response.data.artifacts
              .filter((artifact) => artifact.name.startsWith('kelivo-debug'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of artifacts.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if flutter build apk --debug --target-platform android-arm64 --no-pub; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after a short pause."
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-debug-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3
