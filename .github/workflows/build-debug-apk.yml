name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/memory-affect
    paths:
      - .github/workflows/build-debug-apk.yml
      - lib/**
      - android/**
      - pubspec.yaml
      - pubspec.lock

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build debug APKs
        run: flutter build apk --debug --split-per-abi --no-pub

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
